name: Build & Push

on:
  push:
    branches:
    - main
    tags:
    - v*

permissions: {}

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-app:
    name: Build Yonder
    uses: yonder-sh/shared-workflows/.github/workflows/build-container-image.yaml@7243c40643858c8df0c4fd96e300d4df09bdf781
    permissions:
      artifact-metadata: write
      attestations: write
      contents: read
      id-token: write
      packages: write
    with:
      target: app
      image: ${{ github.repository }}

  build-collab:
    name: Build Yonder Collab Server
    uses: yonder-sh/shared-workflows/.github/workflows/build-container-image.yaml@7243c40643858c8df0c4fd96e300d4df09bdf781
    permissions:
      artifact-metadata: write
      attestations: write
      contents: read
      id-token: write
      packages: write
    with:
      target: collab
      image: ${{ github.repository }}-collab
