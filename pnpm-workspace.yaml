# Only the app itself is a workspace package. e2e/ is a standalone package with
# its own lockfile; run its installs with `pnpm install --ignore-workspace`.
packages:
  - '.'
# pnpm 11 ignores the "pnpm" field in package.json; build-script approvals live here.
# sharp: libvips binding (thumbnails). msgpackr-extract: optional native msgpack
# decoder pulled in by bullmq -> msgpackr (prebuilt; falls back to JS if it fails).
allowBuilds:
  esbuild: true
  lightningcss: true
  sharp: true
  msgpackr-extract: true
# Written by pnpm 11 itself: exact versions newer than the default minimum release
# age that were pinned on purpose (versions verified on npm 2026-09-22).
minimumReleaseAgeExclude:
  - '@aws-sdk/checksums@3.1001.1'
  - '@aws-sdk/client-s3@3.1138.0'
  - '@aws-sdk/core@3.978.1'
  - '@aws-sdk/credential-provider-env@3.972.72'
  - '@aws-sdk/credential-provider-http@3.972.74'
  - '@aws-sdk/credential-provider-ini@3.973.17'
  - '@aws-sdk/credential-provider-login@3.972.79'
  - '@aws-sdk/credential-provider-node@3.972.84'
  - '@aws-sdk/credential-provider-process@3.972.72'
  - '@aws-sdk/credential-provider-sso@3.973.16'
  - '@aws-sdk/credential-provider-web-identity@3.972.78'
  - '@aws-sdk/middleware-sdk-s3@3.972.77'
  - '@aws-sdk/nested-clients@3.997.46'
  - '@aws-sdk/s3-request-presigner@3.1138.0'
  - '@aws-sdk/signature-v4-multi-region@3.996.47'
  - '@aws-sdk/token-providers@3.1138.0'
  - '@aws-sdk/types@3.974.6'
  - '@aws-sdk/xml-builder@3.972.41'
  - '@smithy/core@3.35.0'
  - '@smithy/types@4.19.0'
  - framer-motion@13.4.1
  - maplibre-gl@6.11.0
  - motion-dom@13.4.1
  - motion@13.4.1
  - undici@8.11.0
