<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>E2E fixture</title>
<style>
  body { font-family: system-ui, sans-serif; margin: 0; padding: 24px; background: #f6f4ef; color: #1d1d1b; }
  h1 { margin: 0 0 8px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 12px; }
  .card { background: #fff; border-radius: 10px; padding: 16px; box-shadow: 0 1px 3px rgba(0,0,0,.12); }
  #vp { font-variant-numeric: tabular-nums; color: #666; }
</style>
</head>
<body>
  <h1>Yonder e2e fixture</h1>
  <p id="vp"></p>
  <div class="grid">
    <div class="card">Tokyo</div><div class="card">Kyoto</div><div class="card">Seoul</div><div class="card">Taipei</div>
  </div>
  <button id="btn" type="button">Click me</button>
  <p id="out" hidden>clicked</p>
  <script>
    document.getElementById('vp').textContent = `viewport ${innerWidth}x${innerHeight}`;
    document.getElementById('btn').addEventListener('click', () => { document.getElementById('out').hidden = false; });
  </script>
</body>
</html>
